openapi: 3.1.0
info:
  title: Journal & Mood Analysis API
  version: 1.0.0
  description: REST API for user authentication, journal entries, mood analysis, and user profile management.
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        created_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"
    Entry:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        title: { type: string }
        text: { type: string }
        date: { type: string }
        created_at: { type: string, format: date-time }
        mood_analysis:
          $ref: "#/components/schemas/MoodResult"
    MoodResult:
      type: object
      properties:
        overall_sentiment: { type: string }
        sentiment_score: { type: number }
        emotions:
          type: array
          items:
            $ref: "#/components/schemas/EmotionResult"
        summary: { type: string }
        suggestions: { type: string }
        analyzed_at: { type: string, format: date-time }
    EmotionResult:
      type: object
      properties:
        label: { type: string }
        score: { type: number }

paths:
  /api/signup:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Successful signup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: User already exists

  /api/login:
    post:
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /api/entries:
    get:
      summary: Get all journal entries for current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      summary: Create a new journal entry (with RAG mood analysis)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, text]
              properties:
                title: { type: string }
                text: { type: string }
                date: { type: string }
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"

  /api/entries/{id}:
    put:
      summary: Update an existing journal entry
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                text: { type: string }
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
    delete:
      summary: Delete a journal entry
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Entry deleted

  /api/entries/{id}/mood:
    get:
      summary: Get mood analysis for a specific entry
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Mood analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodResult"
        "404":
          description: Not found

  /api/user/profile:
    get:
      summary: Get current user's profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      summary: Update user profile (name and/or password)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        "204":
          description: Profile updated
        "400":
          description: Invalid request
